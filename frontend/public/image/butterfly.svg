  <path d="M100 40 C 96 40, 94 48, 94 60 L 94 105 C 94 118, 97 128, 100 132 C 103 128, 106 118, 106 105 L 106 60 C 106 48, 104 40, 100 40 Z" fill="#3a1a6e"/>

